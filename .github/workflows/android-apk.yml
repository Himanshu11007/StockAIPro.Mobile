# Builds an installable Android APK and attaches it to the run as a
# downloadable artifact (Actions -> this run -> Artifacts).
#
# - Push to master or a ci/* branch, pull request: unit tests + Release APK.
# - Manual run (Run workflow): choose Debug or Release.
# The backend URL is, in order: the "api_base_url" input, the repository
# variable STOCKAIPRO_API_BASE_URL, or the production API below. It is public
# client configuration, not a secret.
#
# Optional repository configuration (Settings -> Secrets and variables -> Actions):
#   Variables: STOCKAIPRO_API_BASE_URL, GOOGLE_SERVER_CLIENT_ID
#   Secrets:   GOOGLE_SERVICES_JSON_BASE64  (base64 of Platforms/Android/google-services.json)
#              ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  (release signing)
# Without the keystore secrets the APK is signed with a generated debug key,
# which installs fine for testing but cannot be updated by a Play Store build.

name: Android APK

on:
  push:
    branches: [master, "ci/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Debug, Release]
        default: Release
      api_base_url:
        description: Backend URL (defaults to the production API)
        type: string
        required: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: StockAIPro.Mobile/StockAIPro.Mobile.csproj
  TFM: net10.0-android
  DEFAULT_API_BASE_URL: https://stocklens-api-otrc.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies
        run: >
          dotnet build "$PROJECT" -f "$TFM" -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AcceptAndroidSDKLicenses=True

      - name: Unit tests
        run: dotnet test StockAIPro.Mobile.Tests/StockAIPro.Mobile.Tests.csproj

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > StockAIPro.Mobile/Platforms/Android/google-services.json

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stocklens.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/stocklens.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
          API_BASE_URL: ${{ inputs.api_base_url || vars.STOCKAIPRO_API_BASE_URL || env.DEFAULT_API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(-f "$TFM" -c "$CONFIGURATION"
                -p:AndroidPackageFormat=apk
                -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
                -p:ApplicationVersion="$GITHUB_RUN_NUMBER")
          if [ "$CONFIGURATION" = "Debug" ]; then
            args+=(-p:EmbedAssembliesIntoApk=true)
          fi
          if [ -n "$API_BASE_URL" ]; then
            args+=(-p:StockAIProApiBaseUrl="$API_BASE_URL")
          fi
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            args+=(-p:GoogleServerClientId="$GOOGLE_SERVER_CLIENT_ID")
          fi
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            args+=(-p:AndroidKeyStore=true
                   -p:AndroidSigningKeyStore="$KEYSTORE_PATH"
                   -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
                   -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
                   -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD)
          fi
          dotnet publish "$PROJECT" "${args[@]}"
          echo "APK_CONFIGURATION=$CONFIGURATION" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-${{ env.APK_CONFIGURATION }}-${{ github.run_number }}
          path: StockAIPro.Mobile/bin/${{ env.APK_CONFIGURATION }}/${{ env.TFM }}/publish/*-Signed.apk
          if-no-files-found: error
